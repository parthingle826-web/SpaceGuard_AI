<svg viewBox="0 0 750 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#070a13" rx="10"/>

  <text x="375" y="30" fill="#00f2fe" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MACHINE LEARNING PIPELINE & MODEL EVALUATION WORKFLOW</text>

  <!-- Step 1 -->
  <rect x="25" y="65" width="120" height="150" rx="8" fill="#0e1525" stroke="#38bdf8"/>
  <text x="85" y="95" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STEP 1</text>
  <text x="85" y="125" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Raw CSV</text>
  <text x="85" y="145" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Telemetry</text>
  <text x="85" y="180" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">7,200 rows</text>

  <!-- Arrow -->
  <line x1="145" y1="140" x2="175" y2="140" stroke="#38bdf8" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="175" y="65" width="120" height="150" rx="8" fill="#0e1525" stroke="#00f2fe"/>
  <text x="235" y="95" fill="#00f2fe" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STEP 2</text>
  <text x="235" y="125" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Feature</text>
  <text x="235" y="145" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Engineering</text>
  <text x="235" y="180" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">18 Features</text>

  <!-- Arrow -->
  <line x1="295" y1="140" x2="325" y2="140" stroke="#00f2fe" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="325" y="65" width="120" height="150" rx="8" fill="#0e1525" stroke="#8b5cf6"/>
  <text x="385" y="95" fill="#8b5cf6" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STEP 3</text>
  <text x="385" y="125" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Stratified</text>
  <text x="385" y="145" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Split (80/20)</text>
  <text x="385" y="180" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Random seed: 42</text>

  <!-- Arrow -->
  <line x1="445" y1="140" x2="475" y2="140" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="475" y="65" width="120" height="150" rx="8" fill="#0e1525" stroke="#f59e0b"/>
  <text x="535" y="95" fill="#f59e0b" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STEP 4</text>
  <text x="535" y="125" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Multi-Model</text>
  <text x="535" y="145" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Training</text>
  <text x="535" y="180" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">DT, SVM, XGB</text>

  <!-- Arrow -->
  <line x1="595" y1="140" x2="625" y2="140" stroke="#f59e0b" stroke-width="2"/>

  <!-- Step 5 -->
  <rect x="625" y="65" width="105" height="150" rx="8" fill="#0e1525" stroke="#10b981"/>
  <text x="677" y="95" fill="#10b981" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STEP 5</text>
  <text x="677" y="125" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Evaluation</text>
  <text x="677" y="145" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">& Metrics</text>
  <text x="677" y="180" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">metrics.json</text>
</svg>
