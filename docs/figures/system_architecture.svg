<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1525"/>
      <stop offset="100%" stop-color="#141f37"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070a13" rx="12"/>

  <!-- System Header -->
  <text x="400" y="35" fill="#00f2fe" font-family="'Orbitron', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">SPACEGUARD AI: SYSTEM ARCHITECTURE</text>
  <text x="400" y="55" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Academic Satellite Telemetry Anomaly Detection & Decision Support Pipeline</text>

  <!-- Node 1: Ingestion -->
  <rect x="30" y="90" width="160" height="210" rx="8" fill="url(#bgBox)" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="110" y="118" fill="#00f2fe" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INGESTION</text>
  <rect x="45" y="135" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="110" y="154" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">LEO Orbit Stream</text>
  <rect x="45" y="175" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="110" y="194" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CSV Dataset Batch</text>
  <rect x="45" y="215" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="110" y="234" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">11 Sensor Readings</text>
  <text x="110" y="275" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Sampling: 10s</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="195" x2="230" y2="195" stroke="#00f2fe" stroke-width="2"/>
  <polygon points="230,195 222,190 222,200" fill="#00f2fe"/>

  <!-- Node 2: Preprocessing -->
  <rect x="230" y="90" width="160" height="210" rx="8" fill="url(#bgBox)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310" y="118" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PREPROCESSING</text>
  <rect x="245" y="135" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="310" y="154" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Schema Validation</text>
  <rect x="245" y="175" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="310" y="194" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Feature Engineering</text>
  <rect x="245" y="215" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="310" y="234" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">StandardScaler Fit</text>
  <text x="310" y="275" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">18 Feature Vector</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="390" y1="195" x2="430" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="430,195 422,190 422,200" fill="#38bdf8"/>

  <!-- Node 3: ML Inference -->
  <rect x="430" y="90" width="160" height="210" rx="8" fill="url(#bgBox)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="510" y="118" fill="#8b5cf6" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ML ENGINE</text>
  <rect x="445" y="135" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="510" y="154" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Decision Tree (CART)</text>
  <rect x="445" y="175" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="510" y="194" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SVM (RBF Kernel)</text>
  <rect x="445" y="215" width="130" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="510" y="234" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">XGBoost (Softprob)</text>
  <text x="510" y="275" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">MODEL_REGISTRY</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="590" y1="195" x2="630" y2="195" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="630,195 622,190 622,200" fill="#8b5cf6"/>

  <!-- Node 4: Decision Support -->
  <rect x="630" y="90" width="140" height="210" rx="8" fill="url(#bgBox)" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="118" fill="#10b981" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DECISION</text>
  <rect x="640" y="135" width="120" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="700" y="154" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Feature Attribution</text>
  <rect x="640" y="175" width="120" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="700" y="194" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Rule Engine</text>
  <rect x="640" y="215" width="120" height="30" rx="4" fill="#070a13" stroke="rgba(255,255,255,0.1)"/>
  <text x="700" y="234" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SQLite History Log</text>
  <text x="700" y="275" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Operator Guidance</text>
</svg>
